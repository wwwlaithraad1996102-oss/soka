<!doctype html>
<html lang="ar" dir="rtl">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="theme-color"
    content="#08080b"
  >

  <title>SOKA — تسجيل الدخول</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(
          circle at top,
          #222235 0%,
          #0b0b10 45%,
          #050507 100%
        );

      color: #fff;

      font-family:
        Arial,
        Tahoma,
        sans-serif;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      font-size: 48px;
      font-weight: 900;
      letter-spacing: 4px;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #aaa;
      margin-bottom: 25px;
    }

    .card {
      background: rgba(20, 20, 27, .96);
      border: 1px solid #292933;
      border-radius: 18px;
      padding: 25px;

      box-shadow:
        0 20px 60px rgba(0,0,0,.45);
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 20px;
    }

    .tabs button {
      flex: 1;
      padding: 12px;
      border: 0;
      border-radius: 10px;

      background: #18181f;
      color: #aaa;

      cursor: pointer;
      font-size: 15px;
    }

    .tabs button.active {
      background: #fff;
      color: #000;
      font-weight: bold;
    }

    form {
      display: none;
    }

    form.active {
      display: block;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #ddd;
      font-size: 14px;
    }

    input {
      width: 100%;
      padding: 14px;

      border-radius: 10px;
      border: 1px solid #33333e;

      background: #0d0d12;
      color: #fff;

      outline: none;

      margin-bottom: 15px;

      font-size: 15px;
    }

    input:focus {
      border-color: #777;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 10px;

      padding: 14px;

      background: #fff;
      color: #000;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .btn:disabled {
      opacity: .5;
      cursor: wait;
    }

    .message {
      display: none;

      margin-top: 15px;
      padding: 12px;

      border-radius: 10px;

      background: #17171e;

      color: #ddd;

      line-height: 1.6;
      font-size: 14px;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #351719;
      color: #ffb8b8;
      border: 1px solid #652326;
    }

    .message.success {
      background: #15321f;
      color: #b8ffce;
      border: 1px solid #245f38;
    }

    .account {
      display: none;
      text-align: center;
    }

    .account.show {
      display: block;
    }

    .account-email {
      margin: 15px 0;
      padding: 15px;

      background: #101016;
      border-radius: 10px;

      color: #ddd;

      word-break: break-all;
    }

    .logout {
      background: #2b2b34;
      color: #fff;
      margin-top: 10px;
    }

    .status {
      text-align: center;
      color: #777;
      font-size: 12px;
      margin-top: 20px;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="logo">
    SOKA
  </div>

  <div class="subtitle">
    منصة SOKA
  </div>

  <div class="card">

    <!-- AUTH -->

    <div id="authBox">

      <div class="tabs">

        <button
          id="loginTab"
          class="active"
          type="button"
        >
          تسجيل الدخول
        </button>

        <button
          id="signupTab"
          type="button"
        >
          إنشاء حساب
        </button>

      </div>


      <!-- LOGIN -->

      <form
        id="loginForm"
        class="active"
      >

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="loginEmail"
          type="email"
          autocomplete="email"
          placeholder="example@gmail.com"
          required
        >

        <label>
          كلمة المرور
        </label>

        <input
          id="loginPassword"
          type="password"
          autocomplete="current-password"
          placeholder="كلمة المرور"
          required
        >

        <button
          id="loginButton"
          class="btn"
          type="submit"
        >
          تسجيل الدخول
        </button>

      </form>


      <!-- SIGNUP -->

      <form
        id="signupForm"
      >

        <label>
          الاسم
        </label>

        <input
          id="signupName"
          type="text"
          placeholder="اسمك"
          required
        >

        <label>
          البريد الإلكتروني
        </label>

        <input
          id="signupEmail"
          type="email"
          autocomplete="email"
          placeholder="example@gmail.com"
          required
        >

        <label>
          كلمة المرور
        </label>

        <input
          id="signupPassword"
          type="password"
          autocomplete="new-password"
          minlength="6"
          placeholder="6 أحرف على الأقل"
          required
        >

        <button
          id="signupButton"
          class="btn"
          type="submit"
        >
          إنشاء الحساب
        </button>

      </form>


      <div
        id="message"
        class="message"
      ></div>

    </div>


    <!-- ACCOUNT -->

    <div
      id="accountBox"
      class="account"
    >

      <h2>
        👋 أهلاً بك في SOKA
      </h2>

      <p>
        تم تسجيل الدخول بنجاح.
      </p>

      <div
        id="accountEmail"
        class="account-email"
      ></div>

      <button
        id="logoutButton"
        class="btn logout"
        type="button"
      >
        تسجيل الخروج
      </button>

      <div
        id="accountMessage"
        class="message"
      ></div>

    </div>

  </div>

  <div class="status">
    SOKA Authentication Test
  </div>

</div>


<!-- SUPABASE CONFIG -->

<script src="./config.js"></script>


<!-- SUPABASE -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<!-- SOKA APP -->

<script src="./app.js"></script>

</body>

</html>
