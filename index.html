<!doctype html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  >

  <title>SOKA — تسجيل الدخول</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #08080b;
      color: #fff;
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 430px;
      background: #15151b;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 20px 60px #000;
    }

    h1 {
      text-align: center;
      font-size: 42px;
      margin: 0 0 10px;
    }

    h2 {
      text-align: center;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 7px 0;
      border: 1px solid #333;
      border-radius: 10px;
      background: #0d0d11;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 10px;
      background: #e50914;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .secondary {
      background: #333;
    }

    .message {
      margin: 15px 0;
      padding: 12px;
      border-radius: 10px;
      background: #24242b;
      text-align: center;
      line-height: 1.6;
    }

    .message.error {
      background: #55151a;
    }

    .message.success {
      background: #14532d;
    }

    .user {
      text-align: center;
      margin: 15px 0;
      line-height: 1.8;
    }

    .hidden {
      display: none !important;
    }

    hr {
      border: 0;
      border-top: 1px solid #333;
      margin: 30px 0;
    }

    .muted {
      color: #aaa;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="box">

    <h1>SOKA</h1>

    <p class="muted">
      منصة الأفلام والمسلسلات
    </p>

    <div id="message" class="message">
      جاري الاتصال بـ Supabase…
    </div>

    <div id="userInfo" class="user">
      لم يتم تسجيل الدخول
    </div>

    <form id="loginForm">

      <h2>🔐 تسجيل الدخول</h2>

      <input
        id="email"
        type="email"
        placeholder="البريد الإلكتروني"
        autocomplete="email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="كلمة المرور"
        autocomplete="current-password"
        required
      >

      <button type="submit">
        تسجيل الدخول
      </button>

    </form>

    <hr>

    <form id="signupForm">

      <h2>📝 إنشاء حساب</h2>

      <input
        id="signupName"
        type="text"
        placeholder="الاسم"
        required
      >

      <input
        id="signupEmail"
        type="email"
        placeholder="البريد الإلكتروني"
        required
      >

      <input
        id="signupPassword"
        type="password"
        placeholder="كلمة المرور"
        minlength="6"
        required
      >

      <button
        class="secondary"
        type="submit"
      >
        إنشاء حساب
      </button>

    </form>

    <button
      id="logoutBtn"
      class="hidden"
    >
      تسجيل الخروج
    </button>

  </div>

  <script src="config.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>

</body>

</html>
